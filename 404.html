<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>404 — Page Not Found · Bache Dabba</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,400;0,700;0,900;1,400&family=Patrick+Hand&display=swap" rel="stylesheet">
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="manifest" href="/site.webmanifest">
<style>
@font-face {
  font-family: 'Patrick Hand';
  src: url('fonts/patrick-hand.regular.ttf') format('truetype'),
       url('/fonts/patrick-hand.regular.ttf') format('truetype');
  font-weight: normal;
  font-style: normal;
  font-display: swap;
}
@font-face {
  font-family: 'Lato';
  src: url('fonts/lato.regular.ttf') format('truetype'),
       url('/fonts/lato.regular.ttf') format('truetype');
  font-weight: 400;
  font-style: normal;
  font-display: swap;
}
:root {
  --paper: #EEF1F4;
  --ink: #14213D;
  --muted: #4F5B73;
  --bus: #FFB800;
  --bus-ink: #14213D;
  --display: "Patrick Hand", "Lato", cursive, sans-serif;
  --body: "Lato", -apple-system, "Segoe UI", Roboto, sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  min-height: 100vh;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--body);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 24px;
  text-align: center;
}
.box {
  max-width: 480px;
  background: #ffffff;
  padding: 48px 32px;
  border-radius: 16px;
  box-shadow: 0 10px 30px rgba(20, 33, 61, 0.08);
  border: 2px solid #C9D0DA;
}
.logo {
  width: 80px;
  height: 80px;
  object-fit: contain;
  margin-bottom: 16px;
}
h1 {
  font-family: var(--display);
  font-size: 3.5rem;
  line-height: 1;
  color: var(--bus-ink);
  margin-bottom: 8px;
}
h2 {
  font-family: var(--display);
  font-size: 1.8rem;
  margin-bottom: 12px;
}
p {
  color: var(--muted);
  font-size: 1.05rem;
  line-height: 1.5;
  margin-bottom: 28px;
}
.btn {
  display: inline-block;
  background: var(--bus);
  color: var(--bus-ink);
  font-weight: 700;
  text-decoration: none;
  padding: 12px 28px;
  border-radius: 8px;
  border: 2px solid var(--bus);
  transition: transform .15s ease;
}
.btn:hover {
  transform: translateY(-2px);
}
</style>
<script type="module" src="/analytics.js"></script>
</head>
<body data-page="404">
<div class="box">
  <img src="/logo.png" alt="Bache Dabba Logo" class="logo">
  <h1>404</h1>
  <h2>Lunch box went on the wrong route!</h2>
  <p>The page you are looking for doesn't exist or has been moved.</p>
  <a class="btn" href="/">Return to Home</a>
</div>
</body>
</html>
